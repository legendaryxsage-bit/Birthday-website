<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chapter 1 — The First Light</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <!-- 🎵 YOUR AUDIO FILE 🎵 -->
  <audio id="site-audio-1" src="music1.mp3" loop preload="auto"></audio>
  <audio id="site-audio-2" src="music2.mp3" loop preload="auto"></audio>


  <div id="app-container">
    <div id="night-bg"></div>
    
    <!-- Swapped beach video for forest image -->
    <img id="forest-img" class="hidden" src="forest.png" alt="Forest Background">
    
    <div id="fireflies-container" class="hidden"></div>
    <canvas id="particleCanvas"></canvas>
    <div id="flash-overlay"></div>

    <div id="scene1-orb" class="orb"></div>
    <p id="scene1-text" class="script-text">Touch the light</p>

    <!-- Corrected: Direct <img> tag for your custom heart.png -->
    <div id="heart-wrapper" class="hidden">
      <img id="heart-img" src="heart.png" alt="Heart">
    </div>
    
    <div id="crystal-container"></div>

    <!-- Living stars: generated dynamically in script.js, revealed alongside the moon/clouds -->
    <div id="stars-container" class="hidden"></div>

    <!-- Butterfly Wrapper -->
    <div id="butterfly-wrapper" class="hidden">
      <img id="butterfly" src="butterfly.png" alt="Butterfly">
    </div>
    
    <img id="cloud1" src="cloud1.png" class="asset-img cloud hidden" alt="Cloud 1">
    <img id="cloud2" src="cloud2.png" class="asset-img cloud-flip hidden" alt="Cloud 2">
    <img id="cloud3" src="cloud3.png" class="asset-img cloud hidden" alt="Cloud 3">
    <img id="cloud4" src="cloud4.png" class="asset-img cloud hidden" alt="Cloud 4">
    <img id="cloud5" src="cloud5.png" class="asset-img cloud hidden" alt="Cloud 5">
    <img id="cloud6" src="cloud1.png" class="asset-img cloud hidden" alt="Cloud 6">
    <img id="cloud7" src="cloud2.png" class="asset-img cloud-flip hidden" alt="Cloud 7">
    <img id="moon" src="moon.png" class="asset-img hidden" alt="Moon">
  </div>

  <!-- ===================== CHAPTER 2 — THE BIRTHDAY WISH ===================== -->
  <div id="chapter2-container">
    <canvas id="ch2-particle-canvas"></canvas>

    <div id="ch2-golden-rays"></div>
    <div id="ch2-golden-light"></div>

    <div id="ch2-butterfly-wrapper">
      <img id="ch2-butterfly" src="butterfly.png" alt="Butterfly">
    </div>

    <div id="ch2-name-text"></div>

    <div id="ch2-swarm-container"></div>

    <div id="ch2-greeting">
      <p id="ch2-greeting-line1">🎂 Happy Birthday,</p>
      <p id="ch2-greeting-line2">Bittiii! 💗👀😘💌</p>
    </div>

    <div id="ch2-hearts-container"></div>
    <div id="ch2-sparkles-container"></div>

    <!-- ============= SCENES 9-14 — COMET, TRANSITION & FINAL INVITATION ============= -->
    <div id="ch2-comet-wrapper">
      <div id="ch2-comet-tail"></div>
      <div id="ch2-comet-core"></div>
    </div>

    <div id="ch2-final-message">
      <p id="ch2-final-line1"></p>
      <p id="ch2-final-line2"></p>
    </div>

    <div id="ch2-cta-button" role="button" tabindex="0"></div>
  </div>

  <!-- ===================== CHAPTER 4 ===================== -->
  <div id="chapter4-container"></div>

  <!-- =====================================================================
       CHAPTER 5 — THE GRAND FINALE
       ===================================================================== -->
  <div id="chapter5-container">

    <!-- Subtle dark overlay used to dim the scene the moment the wind hits -->
    <div id="ch5-darken-overlay"></div>

    <!-- Single canvas powers the ENTIRE fireworks show (see chapter5.js) -->
    <canvas id="ch5-fireworks-canvas"></canvas>

    <!-- A simple round stand the cake rests on, so it doesn't float -->
    <div id="ch5-cake-table">
      <div id="ch5-table-top"></div>
      <div id="ch5-table-stem"></div>
      <div id="ch5-table-base"></div>
    </div>

    <!-- The Cake -->
    <div id="ch5-cake-wrapper">
      <!-- 👉 Swap this src for your real cake artwork (transparent PNG works best) -->
      <img id="ch5-cake-img" src="cake.png" alt="Birthday Cake">

      <!-- Candles sit on top of the cake image, positioned in % so they scale with it -->
      <div class="ch5-candle" id="ch5-candle-1">
        <div class="ch5-flame"></div>
        <div class="ch5-wick"></div>
      </div>
      <div class="ch5-candle" id="ch5-candle-2">
        <div class="ch5-flame"></div>
        <div class="ch5-wick"></div>
      </div>
      <div class="ch5-candle" id="ch5-candle-3">
        <div class="ch5-flame"></div>
        <div class="ch5-wick"></div>
      </div>

      <!-- Smoke wisps — hidden until the candles are blown out -->
      <div class="ch5-smoke" id="ch5-smoke-1"></div>
      <div class="ch5-smoke" id="ch5-smoke-2"></div>
      <div class="ch5-smoke" id="ch5-smoke-3"></div>
    </div>

    <!-- "Make a wish..." floats above the cake (revealed only after the button is tapped) -->
    <p id="ch5-wish-text">Make a wish...</p>

    <!-- Bottom button — she taps this once the cake has landed -->
    <div id="ch5-wish-btn" role="button" tabindex="0">Make a Wish 🎂</div>

    <!-- The final vow — fades in once the fireworks are underway -->
    <div id="ch5-final-vow">
      <p id="ch5-final-vow-text">Happy Birthday, My cherished...<br> , lalliii..&nbsp;💖⃟💗᪲᪲᪲
    </div>

    <!-- A small pool of drifting hearts around the final vow -->
    <div id="ch5-hearts-container"></div>

  </div>
  
    <!-- =====================================================================
       CHAPTER 6 — THE WISH
       ===================================================================== -->
  <div id="chapter6-container">
    
    <!-- Subtle ambient particles/fireflies -->
    <div id="ch6-particles"></div>

    <!-- Glassmorphism Wish Card -->
    <div id="ch6-card">
      <h2 id="ch6-heading">💖 Type your birthday wish...💝ִֶָ ࣪ ִֶָ🦢</h2>
      <p id="ch6-subheading">I promise I'll do my best to make it come true. ✨💗 𓁇𓁋</p>
      
      <textarea id="ch6-wish-input" placeholder="Write your birthday wish here..." rows="1"></textarea>
      
      <button id="ch6-send-btn">
        <span class="ch6-btn-text">✨ Send My Wish</span>
        <span class="ch6-btn-loader hidden"></span>
      </button>
    </div>

    <!-- Success State Elements -->
    <div id="ch6-success-message" class="hidden">
      Your wish has been safely landed in my heart. <𝟑💗✨
    </div>
    
    <!-- We reuse the existing butterfly asset -->
    <img id="ch6-butterfly" src="butterfly.png" class="hidden" alt="Butterfly">
    
    <div id="ch6-sparkles-container"></div>
  </div>

  <!-- 👇 Your scripts remain at the very bottom 👇 -->
  <script src="script.js"></script>
  <script src="chapter2.js"></script>
  <script src="chapter3.js"></script>
  <script src="chapter4.js"></script>
  <script src="chapter5.js"></script>
  <script src="chapter6.js"></script>

</body>
</html>
